<html>
<head>
	<script>
		(function(){var s=localStorage.getItem('theme'),d=window.matchMedia('(prefers-color-scheme: dark)').matches;if(s==='dark'||((!s)&&d))document.documentElement.classList.add('dark');})();
	</script>
	<script>
		MathJax = {
			tex: { inlineMath: [['\\(', '\\)'], ['$', '$']], displayMath: [['\\[', '\\]'], ['$$', '$$']] },
			svg: { fontCache: 'global' }
		};
	</script>
	<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
	<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Final Project — CS184/284A Spring 2025</title>
	<style>
		*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

		:root {
			--bg: #f9f9f8;
			--surface: #ffffff;
			--text: #1a1a1a;
			--text-muted: #6b6b6b;
			--text-faint: #9b9b9b;
			--accent: #2563eb;
			--accent-light: rgba(37,99,235,0.07);
			--border: #e5e5e3;
			--border-strong: #d0d0ce;
			--code-bg: #f3f3f1;
			--code-color: #c62a2a;
			--radius: 8px;
			--radius-lg: 12px;
			--btn-bg: #ebebea;
			--btn-hover: #dededc;
			--row-alt: #fafaf9;
		}

		html.dark {
			--bg: #1e1e1e;
			--surface: #2d2d2d;
			--text: #ececec;
			--text-muted: #999999;
			--text-faint: #666666;
			--accent: #5b9cf6;
			--accent-light: rgba(91,156,246,0.1);
			--border: #3d3d3d;
			--border-strong: #4d4d4d;
			--code-bg: #252525;
			--code-color: #f28b82;
			--btn-bg: #3a3a3a;
			--btn-hover: #444444;
			--row-alt: #333333;
		}

		/* ── Theme toggle button ── */
		#theme-toggle {
			position: fixed;
			top: 18px;
			right: 20px;
			z-index: 100;
			display: flex;
			align-items: center;
			gap: 6px;
			padding: 7px 12px;
			background: var(--btn-bg);
			border: none;
			border-radius: 100px;
			cursor: pointer;
			font-family: inherit;
			font-size: 12px;
			font-weight: 500;
			color: var(--text-muted);
			transition: background 0.15s, color 0.15s;
		}
		#theme-toggle:hover {
			background: var(--btn-hover);
			color: var(--text);
		}
		#theme-toggle svg {
			width: 14px;
			height: 14px;
			flex-shrink: 0;
		}
		.icon-sun  { display: none; }
		.icon-moon { display: block; }
		html.dark .icon-sun  { display: block; }
		html.dark .icon-moon { display: none; }

		html { scroll-behavior: smooth; }

		body {
			font-family: 'Inter', system-ui, sans-serif;
			background: var(--bg);
			color: var(--text);
			font-size: 15px;
			line-height: 1.7;
			-webkit-font-smoothing: antialiased;
		}

		/* ── Layout ── */
		.page {
			max-width: 800px;
			margin: 0 auto;
			padding: 80px 40px 120px;
		}

		/* ── Header ── */
		.site-header {
			margin-bottom: 72px;
			padding-bottom: 40px;
			border-bottom: 1px solid var(--border);
		}

		.site-header .label {
			font-size: 11px;
			font-weight: 500;
			letter-spacing: 0.1em;
			text-transform: uppercase;
			color: var(--text-muted);
			margin-bottom: 14px;
		}

		.site-header h1 {
			font-size: 30px;
			font-weight: 600;
			letter-spacing: -0.025em;
			line-height: 1.2;
			margin-bottom: 10px;
		}

		.author {
			font-size: 14px;
			color: var(--text-muted);
			margin-bottom: 20px;
		}

		.header-links {
			display: flex;
			gap: 20px;
			flex-wrap: wrap;
		}

		.header-link-label {
			font-size: 13px;
			color: var(--text-muted);
		}

		.header-links a {
			color: var(--accent);
			text-decoration: none;
		}

		.header-links a:hover { text-decoration: underline; }

		/* ── TOC ── */
		.toc {
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: var(--radius-lg);
			padding: 24px 28px;
			margin-bottom: 64px;
		}

		.toc-title {
			font-size: 11px;
			font-weight: 600;
			letter-spacing: 0.1em;
			text-transform: uppercase;
			color: var(--text-muted);
			margin-bottom: 14px;
		}

		.toc ol {
			list-style: none;
			counter-reset: toc;
			display: flex;
			flex-direction: column;
			gap: 6px;
		}

		.toc li { counter-increment: toc; }

		.toc a {
			font-size: 14px;
			color: var(--text);
			text-decoration: none;
			display: flex;
			gap: 10px;
			align-items: baseline;
		}

		.toc a::before {
			content: counter(toc, decimal-leading-zero);
			font-size: 11px;
			font-weight: 500;
			color: var(--text-faint);
			flex-shrink: 0;
			font-variant-numeric: tabular-nums;
		}

		.toc a:hover { color: var(--accent); }

		/* ── Sections ── */
		.section {
			margin-bottom: 80px;
		}

		.section-tag {
			display: inline-flex;
			align-items: center;
			gap: 6px;
			font-size: 11px;
			font-weight: 600;
			letter-spacing: 0.1em;
			text-transform: uppercase;
			color: var(--accent);
			background: var(--accent-light);
			padding: 4px 10px;
			border-radius: 100px;
			margin-bottom: 16px;
		}

		h2 {
			font-size: 22px;
			font-weight: 600;
			letter-spacing: -0.02em;
			line-height: 1.3;
			margin-bottom: 20px;
			color: var(--text);
			scroll-margin-top: 32px;
		}

		h3 {
			font-size: 16px;
			font-weight: 600;
			letter-spacing: -0.01em;
			margin-top: 36px;
			margin-bottom: 12px;
			color: var(--text);
		}

		h4 {
			font-size: 14px;
			font-weight: 600;
			margin-top: 28px;
			margin-bottom: 10px;
			color: var(--text);
		}

		p { margin-bottom: 14px; }
		p:last-child { margin-bottom: 0; }

		ul, ol {
			padding-left: 20px;
			margin-bottom: 14px;
		}

		li { margin-bottom: 6px; }
		li:last-child { margin-bottom: 0; }

		/* ── Images ── */
		figure {
			margin: 32px 0;
		}

		.fig-row {
			display: grid;
			gap: 12px;
			margin: 32px 0;
		}
		.fig-row.cols-2 { grid-template-columns: repeat(2, 1fr); }
		.fig-row.cols-3 { grid-template-columns: repeat(3, 1fr); }
		.fig-row.cols-4 { grid-template-columns: repeat(4, 1fr); }

		figure img, .fig-row img {
			width: 100%;
			border-radius: var(--radius);
			border: 1px solid var(--border);
			display: block;
		}

		figcaption {
			font-size: 13px;
			color: var(--text-muted);
			margin-top: 8px;
			line-height: 1.5;
		}

		.fig-row figcaption { text-align: center; }

		/* ── Code ── */
		code {
			font-family: 'JetBrains Mono', 'Fira Code', monospace;
			font-size: 13px;
			background: var(--code-bg);
			color: var(--code-color);
			padding: 2px 6px;
			border-radius: 4px;
		}

		pre {
			background: var(--code-bg);
			border: 1px solid var(--border);
			border-radius: var(--radius);
			padding: 20px 24px;
			overflow-x: auto;
			margin: 20px 0;
		}

		pre code {
			background: none;
			color: var(--text);
			padding: 0;
			font-size: 13px;
		}

		/* ── Tables ── */
		.table-wrap { overflow-x: auto; margin: 24px 0; }

		table {
			width: 100%;
			border-collapse: collapse;
			font-size: 14px;
		}

		th {
			font-weight: 600;
			font-size: 12px;
			letter-spacing: 0.05em;
			text-transform: uppercase;
			color: var(--text-muted);
			padding: 10px 14px;
			border-bottom: 2px solid var(--border-strong);
			text-align: left;
		}

		td {
			padding: 10px 14px;
			border-bottom: 1px solid var(--border);
		}

		tr:last-child td { border-bottom: none; }
		tr:nth-child(even) td { background: var(--row-alt); }

		/* ── Callout ── */
		.callout {
			background: var(--accent-light);
			border-left: 3px solid var(--accent);
			border-radius: 0 var(--radius) var(--radius) 0;
			padding: 16px 20px;
			margin: 24px 0;
			font-size: 14px;
			color: var(--text);
		}

		@media (max-width: 600px) {
			.page { padding: 48px 20px 80px; }
			.fig-row.cols-3, .fig-row.cols-4 { grid-template-columns: repeat(2, 1fr); }
			.fig-row.cols-2 { grid-template-columns: 1fr; }
			h2 { font-size: 20px; }
		}
	</style>
</head>
<body>
	<button id="theme-toggle" aria-label="Toggle dark mode">
		<svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
			<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
		</svg>
		<svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
			<circle cx="12" cy="12" r="5"/>
			<line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
			<line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
			<line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
			<line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
		</svg>
	</button>

	<div class="page">
		<header class="site-header">
			<p class="label">CS184/284A &nbsp;·&nbsp; Spring 2025 &nbsp;·&nbsp; UC Berkeley</p>
			<h1>Final Project</h1>
			<p class="author">Rudraksh Awasthi</p>
		</header>

		<nav class="toc">
			<p class="toc-title">Contents</p>
			<ol>
				<li><a href="#overview">Overview</a></li>
				<li><a href="#section-1">Section 1</a></li>
			</ol>
		</nav>

		<section class="section" id="overview">
			<span class="section-tag">Overview</span>
			<h2>Overview</h2>
			<p>Write your project overview here.</p>
		</section>

		<section class="section" id="section-1">
			<span class="section-tag">Part 1</span>
			<h2>Section 1</h2>
			<p>Write your content here.</p>
		</section>
	</div>

	<script>
		(function() {
			var saved = localStorage.getItem('theme');
			var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
			if (saved === 'dark' || (!saved && prefersDark)) {
				document.documentElement.classList.add('dark');
			}
		})();
		document.getElementById('theme-toggle').addEventListener('click', function() {
			var isDark = document.documentElement.classList.toggle('dark');
			localStorage.setItem('theme', isDark ? 'dark' : 'light');
		});
	</script>
</body>
</html>
